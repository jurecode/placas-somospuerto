name: Paquete para subir al hosting

# Cada push a main deja un .zip listo para subir por FTP, y además una
# Release con la fecha, para poder volver a una versión anterior.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar la carpeta a subir
        run: |
          mkdir -p sitio
          # lo que va al hosting: el editor, el panel y los recursos
          cp index.html index.php editor.js placa.js dibujo-eyey.js mp4.js robots.txt sitio/
          cp panel-*.html sitio/
          cp -r assets sitio/
          cp -r marca sitio/
          cp -r marcas sitio/
          cp -r api sitio/
          # carpetas que la API necesita poder escribir
          mkdir -p sitio/publicaciones sitio/fotos
          touch sitio/publicaciones/.gitkeep sitio/fotos/.gitkeep
          # lo que NO va: el editor viejo en Python y el arte original
          rm -f sitio/assets/subidas/* 2>/dev/null || true
          echo "Versión $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}" > sitio/VERSION.txt

      # El hosting cachea los archivos sueltos por meses y no respeta el
      # .htaccess. Firmando el nombre con la versión, cada HTML pide su propio
      # editor: aunque el navegador tenga guardada una copia vieja, nunca puede
      # mezclar mitades de dos versiones distintas.
      - name: Firmar los archivos con la versión
        env:
          V: ${{ github.run_number }}
        run: |
          sed -i "s|src=\"editor.js\"|src=\"editor.js?v=$V\"|" sitio/index.html

          # Todos los import, no solo el de editor.js. Antes se firmaba a mano
          # `from './placa.js'` y nada más, así que dibujo-eyey.js, mp4.js y el
          # placa.js que pide dibujo-eyey.js viajaban sin firma: el navegador
          # se quedaba con la copia de hace meses y la mezclaba con la nueva.
          # Eso hizo que eyey siguiera dibujando cuadrado con el resto del
          # editor ya en 4:5, y no había forma de verlo desde el sitio.
          for f in sitio/*.js; do
            sed -i -E "s|from '\./([A-Za-z0-9_./-]+\.js)'|from './\1?v=$V'|g" "$f"
          done
          # y el logo y demás imágenes de assets/, que también quedaban viejas
          sed -i "s|const VERSION = 'dev'|const VERSION = '$V'|" sitio/editor.js

          grep -q "editor.js?v=$V" sitio/index.html || { echo "no se firmó index.html"; exit 1; }
          grep -q "const VERSION = '$V'" sitio/editor.js || { echo "no se firmó VERSION"; exit 1; }
          # Ningún import puede quedar sin firmar: uno solo alcanza para servir
          # medio editor viejo, que es el error más difícil de encontrar de
          # todos, porque el sitio dice que está actualizado.
          if grep -rEn "from '\./[A-Za-z0-9_./-]+\.js'" sitio/*.js; then
            echo "quedaron import sin firmar (arriba)"; exit 1
          fi
          echo "firmados con v=$V:"
          grep -hoE "from '\./[^']+'" sitio/*.js | sort -u

      # Un paquete por medio, cada uno con su marca ya puesta en marca/. Así
      # el sitio se instala descomprimiendo y nada más: nadie tiene que mover
      # carpetas a mano, que es donde se cuelan los errores.
      - name: Comprimir un paquete por medio
        run: |
          cd sitio && zip -rq ../placas-somospuerto.zip . && cd ..
          for medio in $(ls marcas); do
            rm -rf sitio/marca
            cp -r marcas/$medio sitio/marca
            (cd sitio && zip -rq ../placas-$medio.zip .)
            echo "armado placas-$medio.zip con la marca de $medio"
          done
          ls -la placas-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: placas-*.zip
          retention-days: 90

      # El mensaje del commit es la nota de la versión: es lo que el panel
      # muestra como "qué cambió", así que tiene que salir tal cual se escribió.
      - name: Armar la nota de la versión
        run: |
          git log -1 --pretty=%B \
            | sed '/^Co-Authored-By:/d' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notas.md
          cat notas.md

      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          body_path: notas.md
          files: placas-*.zip
